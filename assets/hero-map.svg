<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">A visual roadmap created from a short text outline</title><desc id="desc">Dark work surface with connected research, design, development and launch nodes.</desc>
