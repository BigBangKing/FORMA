<rect width="1100" height="650" rx="28" fill="#151515"/><rect width="1100" height="650" rx="28" fill="url(#dots)"/>
<path d="M64 90H1038" stroke="#333"/><circle cx="58" cy="46" r="7" fill="#FACC15"/><circle cx="83" cy="46" r="7" fill="#555"/><circle cx="108" cy="46" r="7" fill="#555"/>
