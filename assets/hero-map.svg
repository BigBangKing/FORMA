<g font-family="Arial,sans-serif" fill="white" font-weight="700" font-size="19"><rect x="85" y="142" width="230" height="88" rx="17" fill="#303030" stroke="#555"/><text x="200" y="182" text-anchor="middle">01  Research</text><text x="200" y="205" text-anchor="middle" fill="#a9a9a9" font-size="13" font-weight="400">Audience + insights</text><rect x="85" y="378" width="230" height="88" rx="17" fill="#303030" stroke="#555"/><text x="200" y="417" text-anchor="middle">02  Design</text><text x="200" y="441" text-anchor="middle" fill="#a9a9a9" font-size="13" font-weight="400">Ideas + prototypes</text><rect x="785" y="137" width="230" height="88" rx="17" fill="#303030" stroke="#555"/><text x="900" y="177" text-anchor="middle">03  Build</text><text x="900" y="201" text-anchor="middle" fill="#a9a9a9" font-size="13" font-weight="400">Ship the essentials</text><rect x="785" y="378" width="230" height="88" rx="17" fill="#303030" stroke="#555"/><text x="900" y="417" text-anchor="middle">04  Launch</text><text x="900" y="441" text-anchor="middle" fill="#a9a9a9" font-size="13" font-weight="400">Measure + improve</text></g>
