<g fill="none" stroke="#818181" stroke-width="3"><path d="M449 308 C350 308 350 185 242 185"/><path d="M449 308 C353 308 350 420 242 420"/><path d="M651 308 C740 308 737 181 844 181"/><path d="M651 308 C742 308 742 420 844 420"/><path d="M892 203 L892 288"/><path d="M893 442 L893 528"/></g>
